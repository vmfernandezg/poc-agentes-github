# Workflow de GitHub Actions: dispara el equipo de 6 agentes cuando pasa algo en un issue.
#
# Este archivo es el "motor" de la POC dentro de GitHub. Léelo entero: en 30 líneas
# tienes todo el enganche entre los eventos de tu repo y tus agentes de IA.

name: Agentes IA sobre issues

# --- ¿CUÁNDO se ejecuta? -----------------------------------------------------
on:
  issues:
    types: [opened]          # cada vez que se abre un issue nuevo
  issue_comment:
    types: [created]         # o cuando alguien comenta...

# --- PERMISOS (principio de mínimo privilegio) -------------------------------
# El GITHUB_TOKEN solo puede leer el código y escribir en issues. No toca tu código.
permissions:
  contents: read
  issues: write

jobs:
  agentes:
    # Corre si: (a) es un issue nuevo, o (b) es un comentario que contiene "/agentes".
    # Así evitamos bucles: el comentario que publica el bot NO contiene "/agentes".
    if: >
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/agentes'))
    runs-on: ubuntu-latest
    steps:
      # 1) Traer el código del repo (para que el agente Contexto pueda leerlo).
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2) Preparar Python.
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Instalar dependencias.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4) Ejecutar el pipeline de agentes sobre el issue que disparó el evento.
      - name: Ejecutar pipeline de agentes
        env:
          # Secret del repo (Settings -> Secrets and variables -> Actions).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Variable opcional del repo; si no existe, run_actions usa gpt-4o-mini.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # Token que GitHub inyecta solo; lo usamos para comentar y etiquetar.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python run_actions.py
