# Workflow de DESPACHO: al etiquetar un issue, dispara al agente nativo de Copilot que
# corresponda. Este es el corazón de la v2 nativa: "etiqueta un issue -> se arregla solo".
#
# Mapa de etiquetas -> agente (.github/agents/*.md):
#   auto-fix      -> corrige-bugs
#   auto-feature  -> implementa-feature
#   auto-tests    -> escribe-tests
#   auto-docs     -> documenta
#   auto-review   -> revisa-codigo
#
# ⚠️ IMPORTANTE: la API de tareas del agente EXIGE un token de USUARIO (un PAT), no el
# GITHUB_TOKEN normal del workflow (que es server-to-server y NO sirve). Por eso se usa
# el secret COPILOT_AGENT_PAT. Cómo crearlo: ver V2-NATIVA.md.

name: Despacho de agentes IA

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  despachar:
    # Solo corre cuando la etiqueta añadida empieza por "auto-".
    if: startsWith(github.event.label.name, 'auto-')
    runs-on: ubuntu-latest
    steps:
      - name: Disparar al agente de Copilot según la etiqueta
        env:
          # Token de USUARIO (PAT). El GITHUB_TOKEN normal no vale para esta API.
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_PAT }}
          REPO: ${{ github.repository }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secret COPILOT_AGENT_PAT (un PAT de usuario). Ver V2-NATIVA.md."
            exit 1
          fi

          # 1) Etiqueta -> agente
          case "$LABEL" in
            auto-fix)     AGENTE="corrige-bugs" ;;
            auto-feature) AGENTE="implementa-feature" ;;
            auto-tests)   AGENTE="escribe-tests" ;;
            auto-docs)    AGENTE="documenta" ;;
            auto-review)  AGENTE="revisa-codigo" ;;
            *) echo "Etiqueta '$LABEL' sin agente asociado. Nada que hacer."; exit 0 ;;
          esac
          echo "Etiqueta '$LABEL'  ->  agente '$AGENTE'"

          # 2) Prompt para Copilot: seguir el archivo del agente. El auto-cierre del issue
          #    NO se le pide al agente (poco fiable): lo hace este workflow mas abajo (paso 4).
          PROMPT=$(printf 'Sigue estrictamente las instrucciones del agente definido en el archivo .github/agents/%s.md de este repositorio.\n\nTarea proveniente del issue #%s:\nTitulo: %s\n\n%s\n\nCuando termines, abre un Pull Request con tu propuesta.' "$AGENTE" "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY")

          # 3) Crear la tarea del agente (API en preview): POST /agents/repos/{owner}/{repo}/tasks
          BODY=$(jq -n --arg p "$PROMPT" '{prompt:$p, base_ref:"main", create_pull_request:true}')

          if ! RESP=$(printf '%s' "$BODY" | gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/agents/repos/${REPO}/tasks" --input - 2>&1); then
            echo "::error::Fallo al crear la tarea del agente."
            echo "$RESP"
            gh api --method POST "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              -f body="⚠️ No pude despachar al agente **${AGENTE}**. Revisa los logs y el secret COPILOT_AGENT_PAT." || true
            exit 1
          fi
          echo "Tarea creada:"; echo "$RESP"
          TASK_ID=$(printf '%s' "$RESP" | jq -r '.id')
          gh api --method POST "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            -f body="🤖 Despachado el agente **${AGENTE}**. En unos minutos aparecerá un Pull Request (lo enlazaré a este issue para que se cierre al mergear)."

          # 4) AUTO-CIERRE DETERMINISTA: esperar a que la tarea tenga rama, localizar su PR
          #    y anadirle nosotros "Closes #N" (no dependemos de que el agente lo escriba).
          OWNER="${REPO%%/*}"
          HEAD_REF=""
          STATE=""
          # Esperamos a que la tarea esté COMPLETED antes de tocar el PR. Si parcheamos
          # mientras el agente sigue trabajando, este reescribe la descripcion del PR y
          # borra nuestro "Closes #N" (condicion de carrera detectada en pruebas).
          for i in $(seq 1 30); do
            sleep 20
            TASK_JSON=$(gh api "/agents/repos/${REPO}/tasks/${TASK_ID}" 2>/dev/null || true)
            STATE=$(printf '%s' "$TASK_JSON" | jq -r '.state // empty')
            HEAD_REF=$(printf '%s' "$TASK_JSON" | jq -r '.artifacts[]? | select(.type=="branch") | .data.head_ref' 2>/dev/null | head -n1 || true)
            echo "tarea: estado=${STATE:-?}  rama=${HEAD_REF:-?}"
            if [ "$STATE" = "completed" ] && [ -n "$HEAD_REF" ]; then break; fi
          done

          if [ "$STATE" != "completed" ] || [ -z "$HEAD_REF" ]; then
            echo "::warning::La tarea no completó a tiempo; habra que cerrar el issue a mano."
            exit 0
          fi
          echo "Rama del agente: $HEAD_REF (tarea completed)"

          PR_NUM=""
          for i in $(seq 1 8); do
            PR_NUM=$(gh api "/repos/${REPO}/pulls?head=${OWNER}:${HEAD_REF}&state=open" --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$PR_NUM" ]; then break; fi
            sleep 15
          done

          if [ -z "$PR_NUM" ]; then
            echo "::warning::No encontre el PR de la rama ${HEAD_REF}; habra que cerrar el issue a mano."
            exit 0
          fi

          CUR_BODY=$(gh api "/repos/${REPO}/pulls/${PR_NUM}" --jq '.body // ""')
          NEW_BODY=$(printf '%s\n\nCloses #%s' "$CUR_BODY" "$ISSUE_NUMBER")
          gh api --method PATCH "/repos/${REPO}/pulls/${PR_NUM}" -f body="$NEW_BODY" >/dev/null
          echo "PR #${PR_NUM} enlazado con 'Closes #${ISSUE_NUMBER}'. Al mergearlo, el issue se cerrara solo."
